# The muhssg website, built with muhssg. Run `python3 site/sync.py` first:
# it generates content/docs/ from README.md and docs/reference.md.
title: muhssg
baseURL: https://apv022.github.io/muhssg/
language: en
description: A static site generator for personal sites. Markdown in, fast static HTML out. One binary, no Node, no runtime.
image: /img/og.png
output: dist

collections:
  docs:
    title: Docs
    sort: weight

favicon:
  source: favicon.png
  svg: favicon.svg
  background: "#0b0b0b"
  themeColor: "#0b0b0b"

highlight:
  style: github-dark

params:
  repo: https://github.com/apv022/muhssg
