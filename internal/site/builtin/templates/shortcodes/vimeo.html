{{- /* {{< vimeo 76979871 >}} or {{< vimeo id="…" title="…" >}} */ -}}
{{- $id := .Get "id" | default (.Get 0) -}}
{{- if not $id }}{{ errorf "vimeo: needs a video id, e.g. {{< vimeo 76979871 >}}" }}{{ end -}}
<div class="embed embed-video">
  <iframe src="https://player.vimeo.com/video/{{ $id }}?dnt=1" title="{{ .Get "title" | default "Vimeo video" }}"
    loading="lazy" allow="fullscreen; picture-in-picture" allowfullscreen
    style="width:100%;aspect-ratio:16/9;border:0"></iframe>
</div>
