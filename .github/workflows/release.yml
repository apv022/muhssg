name: Release
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build binaries
        run: |
          mkdir -p out
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="muhssg_${GITHUB_REF_NAME}_${os}_${arch}"
            bin=muhssg; [ "$os" = windows ] && bin=muhssg.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "build/$name/$bin" .
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../out/$name.zip" "$name")
            else
              tar -C build -czf "out/$name.tar.gz" "$name"
            fi
          done
          (cd out && sha256sum * > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # Works whether the release was made from a pushed tag or in the
        # GitHub web UI (which creates the tag and the release together).
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
