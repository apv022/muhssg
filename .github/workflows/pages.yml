name: Website
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "README.md", ".github/assets/**", "internal/**", "main.go", "go.*", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - id: go
        name: Go version from go.mod's toolchain line
        run: echo "version=$(awk '/^toolchain go/{sub("go","",$2); print $2}' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
      - id: pages
        uses: actions/configure-pages@v6
      - name: Generate docs pages from README and reference
        run: python3 site/sync.py
      - name: Build the site with this commit's muhssg
        run: go run . build --root site --base-url "${{ steps.pages.outputs.base_url }}/"
      - name: Check links
        run: go run . check --root site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
