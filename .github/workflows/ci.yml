name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt (our code, not vendor/)
        if: runner.os == 'Linux'
        run: |
          files=$(gofmt -l $(git ls-files '*.go' ':!:vendor/'))
          test -z "$files" || (echo "$files" && exit 1)
      - name: vendor/ matches go.mod and go.sum
        if: runner.os == 'Linux'
        run: |
          go mod verify
          go mod vendor
          git diff --exit-code -- vendor go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build the starter site
        shell: bash
        run: |
          go run . new site "$RUNNER_TEMP/demo"
          go run . check --root "$RUNNER_TEMP/demo"
