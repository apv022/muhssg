name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: go
        name: Go version from go.mod's toolchain line
        run: echo "version=$(awk '/^toolchain go/{sub("go","",$2); print $2}' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
      - name: Check the Go version is the one go.mod names
        run: |
          test -n "${{ steps.go.outputs.version }}" || (echo "go.mod has no toolchain line" && exit 1)
          go version
          go version | grep -q "go${{ steps.go.outputs.version }} " || (echo "expected go${{ steps.go.outputs.version }}" && exit 1)
      - name: gofmt (our code, not vendor/)
        if: runner.os == 'Linux'
        run: |
          files=$(gofmt -l $(git ls-files '*.go' ':!:vendor/'))
          test -z "$files" || (echo "$files" && exit 1)
      - name: vendor/ matches go.mod and go.sum
        if: runner.os == 'Linux'
        run: |
          go mod verify
          go mod vendor
          git diff --exit-code -- vendor go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build the starter site
        shell: bash
        run: |
          go run . new site "$RUNNER_TEMP/demo"
          go run . check --root "$RUNNER_TEMP/demo"
